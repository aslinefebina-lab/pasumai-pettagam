<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register as Buyer | Pasumai Pettagam</title>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8fff8;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Logo */
    .logo {
      width: 130px;
      margin-bottom: 15px;
    }

    /* Translation & Speaker Buttons */
    .top-right {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .translate-btn, .speak-btn {
      padding: 6px 12px;
      border: none;
      background: #2e8b57;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .translate-btn:hover, .speak-btn:hover {
      background: #256e47;
    }

    /* Register Box */
    .register-box {
      background: white;
      border-radius: 16px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      padding: 30px 40px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    h2 {
      color: #2e8b57;
      font-size: 1.6rem;
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 15px;
      background: #2e8b57;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }

    button:hover {
      background: #256e47;
    }

    a {
      display: block;
      margin-top: 12px;
      color: #2e8b57;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <!-- TOP RIGHT CONTROLS -->
  <div class="top-right">
    <button class="translate-btn" onclick="translateToTamil()">தமிழ்</button>
    <button class="translate-btn" onclick="translateToEnglish()">English</button>
    <button class="speak-btn" onclick="speakEnglish()">🔊 Speak</button>
  </div>

  <!-- LOGO -->
  <img src="images/dt  logo.png" class="logo" alt="Logo">

  <div class="register-box" id="content">
    <h2 id="title">Register as Buyer</h2>

    <form>
      <label id="nameLabel">Name</label>
      <input type="text" placeholder="Enter your name" required />

      <label id="emailLabel">Email</label>
      <input type="email" placeholder="Enter your email" required />

      <label id="businessLabel">Business Name</label>
      <input type="text" placeholder="Enter business name" required />

      <label id="passwordLabel">Password</label>
      <input type="password" placeholder="Create password" required />

      <button type="button" onclick="window.location.href='home_buyer.html'">Login</button>
    </form>

    <a id="backLink" href="login.html">Back to Login</a>
  </div>

  <script>
    // Speak English Explanation
    function speakEnglish() {
      let message = "This is the buyer registration page. Here the buyer should enter their name, email, business name, and password.";
      let speech = new SpeechSynthesisUtterance(message);
      speech.lang = "en-US";
      window.speechSynthesis.speak(speech);
    }

    // Translate to Tamil
    function translateToTamil() {
      document.getElementById("title").innerText = "வாங்குபவர் பதிவு";
      document.getElementById("nameLabel").innerText = "பெயர்";
      document.getElementById("emailLabel").innerText = "மின்னஞ்சல்";
      document.getElementById("businessLabel").innerText = "வணிகத்தின் பெயர்";
      document.getElementById("passwordLabel").innerText = "கடவுச்சொல்";
      document.getElementById("backLink").innerText = "உள்நுழைவுக்கு திரும்ப";
    }

    // Translate back to English
    function translateToEnglish() {
      document.getElementById("title").innerText = "Register as Buyer";
      document.getElementById("nameLabel").innerText = "Name";
      document.getElementById("emailLabel").innerText = "Email";
      document.getElementById("businessLabel").innerText = "Business Name";
      document.getElementById("passwordLabel").innerText = "Password";
      document.getElementById("backLink").innerText = "Back to Login";
    }
  </script>

</body>
</html>
