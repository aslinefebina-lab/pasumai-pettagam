<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register as Farmer | Pasumai Pettagam</title>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f0fff0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding-top: 20px;
    }

    /* TOP RIGHT BUTTONS */
    .top-buttons {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 10px;
    }

    .btn-small {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-small:hover {
      background: #256527;
    }

    /* LOGO */
    .logo {
      width: 120px;
      margin-bottom: 10px;
    }

    .register-box {
      background: white;
      border-radius: 16px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
      padding: 30px 40px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      color: #2e7d32;
      margin-bottom: 10px;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
      text-align: left;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 15px;
      background: #2e7d32;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1rem;
    }

    button:hover {
      background: #256527;
    }

    a {
      display: block;
      margin-top: 12px;
      color: #2e7d32;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>

<body>

  <!-- TOP RIGHT BUTTONS -->
  <div class="top-buttons">
    <button class="btn-small" onclick="speakEnglish()">🔊 Speaker</button>
    <button class="btn-small" onclick="translateTamil()">🇮🇳 Tamil</button>
    <button class="btn-small" onclick="translateEnglish()">🇬🇧 English</button>
  </div>

  <!-- LOGO -->
  <img src="images/dt  logo.png" class="logo" alt="Logo">

  <div class="register-box" id="content">
    <h2>Register as Farmer</h2>

    <form>
      <label>Name</label>
      <input type="text" placeholder="Enter your name" required />

      <label>Email</label>
      <input type="email" placeholder="Enter your email" required />

      <label>Phone Number</label>
      <input type="tel" placeholder="Enter phone number" required />

      <label>Password</label>
      <input type="password" placeholder="Create password" required />

      <button type="button" onclick="window.location.href='farmer_form.html'">
       submit
</button>

    </form>

    <a href="login.html">Back to Login</a>
  </div>

<script>
/* ---------------- SPEAKER ---------------- */
function speakEnglish() {
  let txt = "This is the farmer registration page. Here the farmer should enter their details such as name, email, phone number and password.";

  let speech = new SpeechSynthesisUtterance(txt);
  speech.lang = "en-US";

  window.speechSynthesis.speak(speech);
}

/* ----------- TRANSLATION SYSTEM ----------- */

let originalText = {
  title: "Register as Farmer",
  name: "Name",
  email: "Email",
  phone: "Phone Number",
  password: "Password",
  submit: "Submit",
  back: "Back to Login"
};

let tamilText = {
  title: "விவசாயியாக பதிவு செய்யவும்",
  name: "பெயர்",
  email: "மின்னஞ்சல்",
  phone: "தொலைபேசி எண்",
  password: "கடவுச்சொல்",
  submit: "சமர்ப்பிக்கவும்",
  back: "உள்நுழைவு صفحへ திரும்பவும்"
};

function translateTamil() {
  document.querySelector("h2").innerText = tamilText.title;

  let labels = document.querySelectorAll("label");
  labels[0].innerText = tamilText.name;
  labels[1].innerText = tamilText.email;
  labels[2].innerText = tamilText.phone;
  labels[3].innerText = tamilText.password;

  document.querySelector("button").innerText = tamilText.submit;

  document.querySelector("a").innerText = tamilText.back;
}

function translateEnglish() {
  document.querySelector("h2").innerText = originalText.title;

  let labels = document.querySelectorAll("label");
  labels[0].innerText = originalText.name;
  labels[1].innerText = originalText.email;
  labels[2].innerText = originalText.phone;
  labels[3].innerText = originalText.password;

  document.querySelector("button").innerText = originalText.submit;

  document.querySelector("a").innerText = originalText.back;
}
</script>

</body>
</html>
