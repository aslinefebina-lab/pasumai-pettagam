<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farmer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="section-title mb-3">Farmer Dashboard</h1>
      <p class="text-muted">Add your crop details to reach buyers and stockists directly.</p>
      <div id="form-status" role="alert"></div>
      <form id="crop-form" class="card custom-card p-4">
        <div class="row g-3">
          <div class="col-md-6"><input name="cropName" class="form-control" placeholder="Crop Name" required /></div>
          <div class="col-md-6"><input name="category" class="form-control" placeholder="Category" required /></div>
          <div class="col-md-6"><input name="quantity" type="number" class="form-control" placeholder="Quantity (kg)" min="1" required /></div>
          <div class="col-md-6"><input name="price" type="number" class="form-control" placeholder="Price (₹/kg)" min="1" required /></div>
          <div class="col-md-6"><label class="form-label">Sowing Date</label><input name="sowingDate" type="date" class="form-control" required /></div>
          <div class="col-md-6"><label class="form-label">Harvest Date</label><input name="harvestingDate" type="date" class="form-control" required /></div>
          <div class="col-md-6"><input name="location" class="form-control" placeholder="Location" required /></div>
          <div class="col-md-6"><input name="imageUrl" type="url" class="form-control" placeholder="Image URL (optional)" /></div>
          <div class="col-md-6"><input name="farmerName" class="form-control" placeholder="Farmer Name" required /></div>
          <div class="col-md-6"><input name="farmerPhone" class="form-control" placeholder="Phone Number" required /></div>
        </div>
        <button class="btn btn-green mt-3" type="submit">Add Crop</button>
      </form>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/farmer.js"></script>
  </body>
</html>
