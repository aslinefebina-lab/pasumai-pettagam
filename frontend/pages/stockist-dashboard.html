<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stockist Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="section-title mb-3">Stockist Dashboard</h1>
      <form id="bulk-filter-form" class="card custom-card p-3 mb-4">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Minimum Quantity (kg)</label>
            <input id="minQuantity" class="form-control" type="number" min="1" value="500" />
          </div>
          <div class="col-md-2"><button class="btn btn-green w-100" type="submit">Load</button></div>
        </div>
      </form>
      <div id="bulk-grid" class="row g-4"></div>
    </main>
    <script src="/js/api.js"></script>
    <script src="/js/stockist.js"></script>
  </body>
</html>
